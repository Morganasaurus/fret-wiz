# Fret Wiz: static single-page app. The site is public (Cloudflare Tunnel -> reverse proxy -> here).
#
# All headers are set once at server level. Locations must not use add_header, because nginx drops every
# server-level add_header inside a location that has its own. Per-path caching is chosen by the map below.

map $uri $fw_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable"; # hashed build output
    ~^/samples/  "public, max-age=604800";              # guitar recordings: keep for a week
    default      "no-store";                            # the page itself: always fresh (see the CSP note)
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    # Content-Security-Policy: only the app's own files. Cloudflare injects two scripts into the page (its bot
    # detection and Web Analytics). It adds the per-request nonce from this header to the scripts it injects,
    # so they run without 'unsafe-inline'. The nonce changes on every request, which is why the page is
    # sent with no-store and without ETag / Last-Modified (a revalidated copy would carry a stale nonce).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $fw_cache_control always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing starting with a dot is ever served (no .git, .env and so on in the image, but be sure).
    location ~ /\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /samples/ {
        try_files $uri =404;
    }

    # Everything else is the app: real files, or index.html for app routes.
    location / {
        etag off;
        if_modified_since off;
        try_files $uri $uri/ /index.html;
    }
}
