services:
  fret-wiz:
    image: ghcr.io/morganasaurus/fret-wiz:latest
    container_name: fret-wiz
    restart: unless-stopped
    ports:
      - "8095:8080"
    environment:
      TZ: Australia/Sydney
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
