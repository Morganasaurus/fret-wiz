<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fret Wiz – iOS mockups</title>
<style>
  /* ---------- iOS system palette ---------- */
  .light {
    --bg: #f2f2f7; --bg2: #ffffff; --bg3: #f2f2f7; --sidebar: #f7f7fa;
    --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --fill: rgba(120,120,128,.12); --fill2: rgba(120,120,128,.08);
    --tint: #007aff; --tint-soft: rgba(0,122,255,.12);
    --neck: #f7f1e6; --neck-edge: #e7dcc9; --fret: #cbbfa9; --string: #a59b8a; --inlay: #e2d6c1;
    --c1: #ff9500; --c2: #af52de; --c3: #007aff; --c4: #34c759; --c5: #ff3b30; --c6: #30b0c7; --c7: #ff2d55;
    --ghost: rgba(120,120,128,.16); --ghost-ink: rgba(60,60,67,.45);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
    --glass: rgba(255,255,255,.72);
  }
  .dark {
    --bg: #000000; --bg2: #1c1c1e; --bg3: #2c2c2e; --sidebar: #1c1c1e;
    --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.16);
    --tint: #0a84ff; --tint-soft: rgba(10,132,255,.2);
    --neck: #221f1c; --neck-edge: #2e2a26; --fret: #57524b; --string: #8f887e; --inlay: #3a3530;
    --c1: #ff9f0a; --c2: #bf5af2; --c3: #0a84ff; --c4: #30d158; --c5: #ff453a; --c6: #40c8e0; --c7: #ff375f;
    --ghost: rgba(118,118,128,.28); --ghost-ink: rgba(235,235,245,.45);
    --shadow: none;
    --glass: rgba(30,30,32,.72);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #d9d9de;
    font-family: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .switcher {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 10px; background: rgba(217,217,222,.9); backdrop-filter: blur(10px); font-size: 14px;
  }
  .switcher button {
    border: 0; border-radius: 999px; padding: 7px 14px; background: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .switcher button.on { background: #1c1c1e; color: #fff; }
  .stage { display: flex; justify-content: center; padding: 18px; }
  .ipad {
    width: 1133px; height: 744px; border-radius: 22px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--label); box-shadow: 0 0 0 10px #1c1c1e, 0 20px 50px rgba(0,0,0,.35);
    font-size: 15px; letter-spacing: -0.01em;
  }

  /* ---------- shared iOS bits ---------- */
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 0; }
  .seg span { padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--label); white-space: nowrap; }
  .seg span.on { background: var(--bg2); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .dark .seg span.on { background: #636366; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--tint);
    background: var(--fill2);
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .capsule {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px;
    background: var(--tint); color: #fff; font-weight: 600; font-size: 15px;
  }
  .capsule.soft { background: var(--tint-soft); color: var(--tint); }
  .card { background: var(--bg2); border-radius: 14px; box-shadow: var(--shadow); }
  .caption { color: var(--label2); font-size: 13px; }
  .section-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
  .home { color: var(--c4); background: color-mix(in srgb, var(--c4) 15%, transparent); }
  .away { color: var(--c3); background: color-mix(in srgb, var(--c3) 15%, transparent); }
  .tension { color: var(--c5); background: color-mix(in srgb, var(--c5) 15%, transparent); }

  .chord-card {
    width: 100%; border-radius: 12px; background: var(--bg2); padding: 8px 6px 9px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: var(--shadow);
    border: 1.5px solid transparent;
  }
  .dark .chord-card { background: var(--bg3); }
  .chord-card.sel { border-color: var(--tint); background: color-mix(in srgb, var(--tint) 8%, var(--bg2)); }
  .chord-card .rn { font-family: "New York", Georgia, serif; font-size: 13px; color: var(--label2); }
  .chord-card.sel .rn { color: var(--tint); }
  .chord-card .sym { font-weight: 700; font-size: 16px; }

  .chip {
    display: inline-flex; flex-direction: column; align-items: center; padding: 6px 14px; border-radius: 10px;
    background: var(--fill2); min-width: 54px;
  }
  .chip .rn { font-family: "New York", Georgia, serif; font-size: 12px; color: var(--label2); }
  .chip b { font-size: 15px; }
  .chip.now { background: var(--tint); color: #fff; }
  .chip.now .rn { color: rgba(255,255,255,.8); }
  .play {
    width: 44px; height: 44px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; flex: none;
  }
  .play svg { width: 18px; height: 18px; fill: #fff; margin-left: 3px; }

  .shape-seg { display: inline-flex; gap: 4px; }
  .shape-seg span {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: 14px;
    background: var(--fill2); color: var(--label); position: relative;
  }
  .shape-seg span.on { background: var(--tint); color: #fff; }
  .shape-seg span.easy::after {
    content: ""; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--c4);
  }

  /* ---------- Direction A: sidebar ---------- */
  .A { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
  .A .side { background: var(--sidebar); border-right: 0.5px solid var(--sep); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .A .side h1 { font-size: 26px; font-weight: 800; margin: 8px 8px 10px; letter-spacing: -0.03em; }
  .A .row { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 10px; font-size: 16px; }
  .A .row svg { width: 20px; height: 20px; color: var(--tint); flex: none; }
  .A .row.on { background: var(--tint); color: #fff; }
  .A .row.on svg { color: #fff; }
  .A .side .group { margin: 14px 10px 4px; font-size: 13px; font-weight: 600; color: var(--label2); }
  .A .key-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 0 6px; }
  .A .key-grid span { height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--fill2); }
  .A .key-grid span.on { background: var(--tint); color: #fff; }
  .A .main { overflow: hidden; display: flex; flex-direction: column; }
  .A .toolbar { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 20px; }
  .A .title { padding: 0 24px 12px; }
  .A .title h2 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
  .A .content { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .A .neck-card { padding: 10px 12px 6px; }
  .A .inspector { display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 12px 16px; align-items: center; }
  .A .chords { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }

  /* ---------- Direction B: floating tabs + sheet ---------- */
  .B { height: 100%; position: relative; display: flex; flex-direction: column; }
  .B .top { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; position: relative; }
  .B .tabs {
    position: absolute; left: 50%; transform: translateX(-50%); top: 12px; display: flex; gap: 2px; padding: 4px;
    border-radius: 999px; background: var(--glass); backdrop-filter: blur(20px); box-shadow: 0 2px 12px rgba(0,0,0,.08);
    border: 0.5px solid var(--sep);
  }
  .B .tabs span { padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--label2); display: flex; gap: 6px; align-items: center; }
  .B .tabs span svg { width: 16px; height: 16px; }
  .B .tabs span.on { background: var(--bg2); color: var(--tint); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .dark .B .tabs span.on { background: #3a3a3c; }
  .B .keypill { display: inline-flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .B .keypill small { font-size: 13px; font-weight: 500; color: var(--label2); letter-spacing: 0; }
  .B .keypill svg { width: 14px; height: 14px; color: var(--tint); }
  .B .neck-wrap { padding: 4px 14px 0; }
  .B .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; height: 372px; background: var(--bg2); border-radius: 18px 18px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,.08); padding: 8px 22px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .dark .B .sheet { background: #1c1c1e; box-shadow: none; border-top: 0.5px solid var(--sep); }
  .B .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--label3); margin: 0 auto 2px; }
  .B .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .B .chords { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .B .lower { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
  .B .panel { background: var(--bg3); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .light .B .panel { background: var(--bg); }

  /* ---------- Direction C: desktop ultrawide (3413×1440 = 5120×2160 at 150%) ---------- */
  .stage.wide { justify-content: flex-start; overflow-x: auto; }
  .frame-wrap { position: relative; }
  .ipad.desktop { flex: none; width: 3413px; height: 1440px; border-radius: 10px; box-shadow: 0 0 0 14px #111, 0 30px 80px rgba(0,0,0,.45); font-size: 16px; transform-origin: top left; }
  .C { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  .C .side { background: var(--sidebar); border-right: 0.5px solid var(--sep); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
  .C .side h1 { font-size: 28px; font-weight: 800; margin: 6px 8px 12px; letter-spacing: -0.03em; }
  .C .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 17px; }
  .C .row svg { width: 21px; height: 21px; color: var(--tint); flex: none; }
  .C .row.on { background: var(--tint); color: #fff; }
  .C .row.on svg { color: #fff; }
  .C .row .kbd { margin-left: auto; }
  .C .group { margin: 16px 10px 6px; font-size: 13px; font-weight: 600; color: var(--label2); }
  .C .key-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 0 6px; }
  .C .key-grid span { height: 38px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; font-weight: 600; background: var(--fill2); }
  .C .key-grid span.on { background: var(--tint); color: #fff; }
  .C .main { display: flex; flex-direction: column; min-width: 0; }
  .C .toolbar { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 0.5px solid var(--sep); }
  .C .toolbar .spacer { flex: 1; }
  .C .head { display: flex; align-items: flex-end; justify-content: space-between; padding: 22px 32px 18px; gap: 24px; }
  .C .head h2 { margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
  .C .transport { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 999px; background: var(--bg2); box-shadow: var(--shadow); }
  .C .body { flex: 1; display: grid; grid-template-rows: 560px 1fr; gap: 22px; padding: 0 32px 28px; min-height: 0; }
  .C .top { display: grid; grid-template-columns: 1fr 620px; gap: 22px; min-height: 0; }
  .C .neck { padding: 18px 22px 12px; position: relative; display: flex; flex-direction: column; gap: 10px; }
  .C .inspector { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .C .bottom { display: grid; grid-template-columns: 1.55fr 1fr 0.9fr; gap: 22px; min-height: 0; }
  .C .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .C .cards7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .C .cards4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .C .chord-card { padding: 12px 6px 12px; gap: 5px; }
  .C .chord-card .sym { font-size: 19px; }
  .C .chord-card .rn { font-size: 15px; }
  .C .list { background: var(--bg2); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .C .list-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 0.5px solid var(--sep); }
  .C .list-row:first-child { border-top: 0; }
  .C .list-row .grow { flex: 1; min-width: 0; }
  .C .list-row b { font-size: 16px; }
  .C .mini-play { width: 34px; height: 34px; border-radius: 50%; background: var(--tint-soft); display: grid; place-items: center; flex: none; }
  .C .mini-play svg { width: 13px; height: 13px; fill: var(--tint); margin-left: 2px; }
  .C .kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--label2); background: var(--fill2); border: 0.5px solid var(--sep); font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .C .shortcut { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 15px; border-top: 0.5px solid var(--sep); }
  .C .shortcut:first-child { border-top: 0; }
  .C .tooltip { position: absolute; z-index: 2; background: var(--bg3); color: var(--label); border-radius: 12px; padding: 10px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.35); font-size: 14px; line-height: 1.4; border: 0.5px solid var(--sep); pointer-events: none; }
  .C .tooltip::after { content: ""; position: absolute; left: 26px; bottom: -6px; width: 12px; height: 12px; background: var(--bg3); transform: rotate(45deg); border-right: 0.5px solid var(--sep); border-bottom: 0.5px solid var(--sep); }
  .light .C .list, .light .C .transport { background: #fff; }
  .notes { font-size: 13px; color: #555; text-align: center; padding: 0 20px 30px; max-width: 900px; margin: 0 auto; line-height: 1.5; }
</style>
</head>
<body>
<div class="switcher">
  <span>Direction</span>
  <button data-dir="A" class="on">A · iPad sidebar</button>
  <button data-dir="B">B · Floating tabs + sheet</button>
  <button data-dir="C">C · Desktop 45″ 5K2K</button>
  <button data-fit title="Desktop mockup: fit the window or show at real size">Fit</button>
  <span style="margin-left:14px">Appearance</span>
  <button data-theme="light" class="on">Light</button>
  <button data-theme="dark">Dark</button>
</div>
<div class="stage"><div class="ipad light" id="ipad"></div></div>
<p class="notes">Static mockup of the Keys screen (key of D major, Bm selected) at iPad mini landscape size, 1133×744.
On Windows the font falls back to Segoe UI; on the iPad it would be Apple's SF Pro, as in native apps.</p>

<script>
// ---------- music data for the mockup ----------
const OPEN = [40, 45, 50, 55, 59, 64];               // E A D G B E
const NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const D_MAJOR = new Set([2, 4, 6, 7, 9, 11, 1]);
const SCALE_NAME = {2:"D",4:"E",6:"F♯",7:"G",9:"A",11:"B",1:"C♯"};
const BM = { 11: ["R", 1], 2: ["♭3", 3], 6: ["5", 5] };   // chroma -> [label, degree]
const BM_SHAPE = [-1, 2, 4, 4, 3, 2];                    // x24432

const icons = {
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  chord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18M14 3v18"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20l4-4 4 2 4-6 6-6"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  speaker: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  sidebar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M9.5 4.5v15M5.5 8h1.8M5.5 11h1.8"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>',
};

// ---------- fretboard ----------
function fretboard(width, height, frets = 15) {
  const padL = 40, padR = 10, padT = 14, padB = 22;
  const nutX = padL + 30;
  const w = width - nutX - padR;
  const real = n => 1 - Math.pow(2, -n / 12);
  const wire = n => nutX + (0.45 * n / frets + 0.55 * real(n) / real(frets)) * w;
  const gap = (height - padT - padB) / 5;
  const y = s => padT + (5 - s) * gap;
  const cx = f => f === 0 ? nutX - 16 : (wire(f - 1) + wire(f)) / 2;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block">`;
  svg += `<rect x="${nutX}" y="${padT - 10}" width="${w}" height="${gap * 5 + 20}" rx="6" fill="var(--neck)" stroke="var(--neck-edge)"/>`;
  for (const f of [3, 5, 7, 9, 15]) if (f <= frets) svg += `<circle cx="${cx(f)}" cy="${padT + gap * 2.5}" r="5" fill="var(--inlay)"/>`;
  if (frets >= 12) { svg += `<circle cx="${cx(12)}" cy="${padT + gap * 1.5}" r="5" fill="var(--inlay)"/><circle cx="${cx(12)}" cy="${padT + gap * 3.5}" r="5" fill="var(--inlay)"/>`; }
  for (let f = 0; f <= frets; f++) {
    svg += `<line x1="${wire(f)}" x2="${wire(f)}" y1="${padT - 10}" y2="${padT + gap * 5 + 10}" stroke="${f ? "var(--fret)" : "var(--label)"}" stroke-width="${f ? 1.5 : 4}" stroke-linecap="round" opacity="${f ? 1 : .75}"/>`;
    svg += `<text x="${cx(f)}" y="${height - 5}" font-size="11" text-anchor="middle" fill="var(--label3)" font-weight="${[3,5,7,9,12,15].includes(f) ? 700 : 500}">${f}</text>`;
  }
  for (let s = 0; s < 6; s++) {
    svg += `<line x1="${nutX - 30}" x2="${width - padR}" y1="${y(s)}" y2="${y(s)}" stroke="var(--string)" stroke-width="${0.8 + (5 - s) * 0.35}"/>`;
    svg += `<text x="14" y="${y(s) + 4}" font-size="12" font-weight="600" fill="var(--label2)" text-anchor="middle">${NAMES[OPEN[s] % 12]}</text>`;
  }
  for (let s = 0; s < 6; s++) {
    if (BM_SHAPE[s] < 0) svg += `<text x="${cx(0)}" y="${y(s) + 5}" font-size="14" font-weight="700" fill="var(--c5)" text-anchor="middle">×</text>`;
    for (let f = 0; f <= frets; f++) {
      const c = (OPEN[s] + f) % 12;
      const inShape = BM_SHAPE[s] === f;
      if (inShape) {
        const [label, deg] = BM[c];
        const root = deg === 1;
        svg += `${root ? `<circle cx="${cx(f)}" cy="${y(s)}" r="15" fill="none" stroke="var(--c${deg})" stroke-width="2"/>` : ""}
          <circle cx="${cx(f)}" cy="${y(s)}" r="12" fill="var(--c${deg})"/>
          <text x="${cx(f)}" y="${y(s) + 4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">${label}</text>`;
      } else if (D_MAJOR.has(c) && !(BM_SHAPE[s] < 0 && f === 0)) {
        const tone = BM[c];
        svg += `<circle cx="${cx(f)}" cy="${y(s)}" r="8.5" fill="${tone ? `color-mix(in srgb, var(--c${tone[1]}) 28%, transparent)` : "var(--ghost)"}"/>
          <text x="${cx(f)}" y="${y(s) + 3}" font-size="8" font-weight="600" fill="var(--ghost-ink)" text-anchor="middle">${SCALE_NAME[c]}</text>`;
      }
    }
  }
  return svg + "</svg>";
}

// ---------- chord diagram ----------
function diagram(frets, size = "sm", degrees = {}) {
  const sm = size === "sm";
  const sg = sm ? 11 : 17, fh = sm ? 11 : 18, padX = sm ? 10 : 22, top = sm ? 12 : 20, r = sm ? 4 : 7;
  const fretted = frets.filter(f => f > 0);
  const min = Math.min(...fretted), max = Math.max(...fretted);
  const start = max <= 4 ? 1 : min;
  const rows = 4;
  const W = padX * 2 + sg * 5, H = top + rows * fh + (sm ? 3 : 8);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  if (start === 1) s += `<rect x="${padX - 1}" y="${top - 3}" width="${sg * 5 + 2}" height="3" rx="1" fill="var(--label)" opacity=".8"/>`;
  else s += `<text x="${padX - (sm ? 4 : 8)}" y="${top + fh / 2 + 4}" font-size="${sm ? 8 : 11}" text-anchor="end" fill="var(--label2)" font-weight="600">${start}fr</text>`;
  for (let i = 0; i <= rows; i++) s += `<line x1="${padX}" x2="${padX + sg * 5}" y1="${top + i * fh}" y2="${top + i * fh}" stroke="var(--label3)" stroke-width="1"/>`;
  for (let i = 0; i < 6; i++) s += `<line x1="${padX + i * sg}" x2="${padX + i * sg}" y1="${top}" y2="${top + rows * fh}" stroke="var(--label3)" stroke-width="1"/>`;
  // barre if the lowest fret repeats across 3+ strings
  const atMin = frets.map((f, i) => f === min ? i : -1).filter(i => i >= 0);
  if (fretted.length > 4 && atMin.length >= 2) {
    const a = atMin[0], b = frets.length - 1;
    s += `<rect x="${padX + a * sg - r}" y="${top + (min - start + .5) * fh - r}" width="${(b - a) * sg + 2 * r}" height="${2 * r}" rx="${r}" fill="var(--label)" opacity=".85"/>`;
  }
  frets.forEach((f, i) => {
    const x = padX + i * sg;
    if (f < 0) s += `<text x="${x}" y="${top - (sm ? 4 : 7)}" font-size="${sm ? 8 : 12}" text-anchor="middle" fill="var(--label3)" font-weight="700">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${top - (sm ? 6 : 10)}" r="${sm ? 2.6 : 4}" fill="none" stroke="var(--label2)" stroke-width="1.2"/>`;
    else {
      const c = (OPEN[i] + f) % 12;
      const deg = degrees[c] || 0;
      s += `<circle cx="${x}" cy="${top + (f - start + .5) * fh}" r="${r}" fill="${deg ? `var(--c${deg})` : "var(--label)"}"/>`;
    }
  });
  return s + "</svg>";
}

// ---------- switcher ----------
const ipad = document.getElementById("ipad");
const params = new URLSearchParams(location.search);
const state = { dir: params.get("dir") || "A", theme: params.get("theme") || "light", fit: params.get("fit") !== "0" };
const stage = document.querySelector(".stage");
function render() {
  const desktop = state.dir === "C";
  ipad.className = `ipad ${desktop ? "desktop" : ""} ${state.theme}`;
  ipad.innerHTML = state.dir === "A" ? directionA() : state.dir === "B" ? directionB() : directionC();
  stage.classList.toggle("wide", desktop);
  const scale = desktop && state.fit ? Math.min(1, (window.innerWidth - 60) / 3413) : 1;
  ipad.style.transform = desktop && scale < 1 ? `scale(${scale})` : "";
  stage.style.height = desktop ? `${1440 * scale + 60}px` : "";
  stage.style.overflowX = desktop && state.fit ? "hidden" : "auto";
  document.querySelector("[data-fit]").style.display = desktop ? "" : "none";
  document.querySelector("[data-fit]").textContent = state.fit ? "Fit to window" : "Actual size";
  document.querySelectorAll("[data-dir]").forEach(b => b.classList.toggle("on", b.dataset.dir === state.dir));
  document.querySelectorAll("[data-theme]").forEach(b => b.classList.toggle("on", b.dataset.theme === state.theme));
}
document.querySelectorAll("[data-dir]").forEach(b => b.onclick = () => { state.dir = b.dataset.dir; if (b.dataset.dir === "C" && !params.get("theme")) state.theme = "dark"; render(); });
document.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { state.theme = b.dataset.theme; render(); });
document.querySelector("[data-fit]").onclick = () => { state.fit = !state.fit; render(); };
window.addEventListener("resize", render);
render();
</script>
